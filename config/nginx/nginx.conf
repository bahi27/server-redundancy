# Configuration Nginx - Load Balancer

# Contexte principal
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # ===== UPSTREAM (Groupe de serveurs) =====
    upstream backend_servers {
        # Algorithme round-robin (alterne entre les serveurs)
        server app-server1:5000 max_fails=3 fail_timeout=30s;
        server app-server2:5000 max_fails=3 fail_timeout=30s;
    }

    # ===== SERVER BLOCK (Configuration du serveur) =====
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # ===== HEALTH CHECK ENDPOINT =====
        location /health {
            access_log off;
            return 200 "nginx ok\n";
            add_header Content-Type text/plain;
        }

        # ===== PROXY PASS (Redirection vers les backends) =====
        location / {
            proxy_pass http://backend_servers;
            
            # Headers importants
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}