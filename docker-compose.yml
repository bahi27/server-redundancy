services:

  # ===== POSTGRESQL SERVER 1 (MASTER) =====
  postgres-server1:
    image: postgres:15-alpine
    container_name: postgres-server1
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      PGDATA: /var/lib/postgresql/data/master
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_1:/var/lib/postgresql/data
      - ./config/postgres/master.conf:/etc/postgresql/postgresql.conf
      - ./config/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf
      - ./config/postgres/master-init.sql:/docker-entrypoint-initdb.d/01-master-init.sql
      - ./config/postgres/.pgpass:/var/lib/postgresql/.pgpass
    command:
      - "postgres"
      - "-c"
      - "config_file=/etc/postgresql/postgresql.conf"
    networks:
      - server-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped


  # ===== POSTGRESQL SERVER 2 (SLAVE) =====
  postgres-server2:
    image: postgres:15-alpine
    container_name: postgres-server2
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      PGDATA: /var/lib/postgresql/data/standby
      PGPASSWORD: replicator_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_2:/var/lib/postgresql/data
      - ./config/postgres/slave.conf:/etc/postgresql/postgresql.conf
      - ./config/postgres/slave-init.sql:/docker-entrypoint-initdb.d/01-slave-init.sql
      - ./config/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf
      - ./config/postgres/.pgpass:/var/lib/postgresql/.pgpass
    command:
      - bash
      - -c
      - |
        set -e

        echo "Waiting for master to be ready..."

        for i in {1..30}; do
          if pg_isready -h postgres-server1 -p 5432 -U postgres; then
            echo "Master is ready!"
            break
          fi

          echo "Attempt $i: Master not ready, waiting..."
          sleep 2
        done

        chmod 600 /var/lib/postgresql/.pgpass
        chown postgres:postgres /var/lib/postgresql/.pgpass

        echo "Starting base backup..."

        # Ensure standby data directory is empty before base backup
        if [ -d /var/lib/postgresql/data/standby ] && [ "$(ls -A /var/lib/postgresql/data/standby)" ]; then
          echo "Cleaning existing standby directory..."
          rm -rf /var/lib/postgresql/data/standby/* || true
        fi

        /usr/local/bin/gosu postgres pg_basebackup \
          -h postgres-server1 \
          -D /var/lib/postgresql/data/standby \
          -U replicator \
          -v \
          -P

        # Ensure correct ownership after base backup
        chown -R postgres:postgres /var/lib/postgresql/data/standby || true

        echo "Starting PostgreSQL in standby mode..."

        exec /usr/local/bin/gosu postgres postgres -c config_file=/etc/postgresql/postgresql.conf
    depends_on:
      postgres-server1:
        condition: service_healthy
    networks:
      - server-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped


  # ===== NGINX LOAD BALANCER =====
  nginx-lb:
    image: nginx:alpine
    container_name: nginx-lb
    ports:
      - "80:80"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app-server1
      - app-server2
    networks:
      - server-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped


  # ===== APPLICATION SERVER 1 =====
  app-server1:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: app-server1
    environment:
      DB_USER: postgres
      DB_PASSWORD: password123
      DB_NAME: serverdb
      DB_HOST: postgres-server1
      DB_PORT: 5432
      SERVER_NAME: Server-1
      SERVER_ID: 1
      APP_PORT: 5000
    ports:
      - "5001:5000"
    depends_on:
      postgres-server1:
        condition: service_healthy
    networks:
      - server-network
    restart: unless-stopped


  # ===== APPLICATION SERVER 2 =====
  app-server2:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: app-server2
    environment:
      DB_USER: postgres
      DB_PASSWORD: password123
      DB_NAME: serverdb
      DB_HOST: postgres-server2
      DB_PORT: 5432
      SERVER_NAME: Server-2
      SERVER_ID: 2
      APP_PORT: 5000
    ports:
      - "5002:5000"
    depends_on:
      postgres-server2:
        condition: service_healthy
    networks:
      - server-network
    restart: unless-stopped


networks:
  server-network:
    driver: bridge


volumes:
  postgres_data_1:
  postgres_data_2: